name: src
description: simple local password management tool
version: 1.0.0
environment:
  sdk: '>=3.1.0-195.0.dev <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^13.2.0
  path_provider: ^2.1.0
  loading_animation_widget: ^1.2.0+4
  google_sign_in: ^6.1.4
  intl: ^0.18.1
  flutter_launcher_icons: ^0.13.1
  sticky_headers: ^0.3.0+2
  permission_handler: ^11.3.0
  local_auth: ^2.1.7
  local_auth_android: ^1.0.34
  local_auth_ios: ^1.1.4
  encrypt: ^5.0.3
  file_picker: ^10.2.0
  external_path: ^2.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/pwdmanager-ios.png"
  adaptive_icon_foreground: "assets/pwdmanager-android.png"
  adaptive_icon_background: "#46B4EB"